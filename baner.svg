<text class="sl s0" style="animation-delay:0.0s" x="600" y="80" text-anchor="middle" font-size="50" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Lubię, jak samo się robi</text><text class="sl" style="animation-delay:3.0s" x="600" y="80" text-anchor="middle" font-size="50" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Wszystko gra i buczy!</text><text class="sl" style="animation-delay:6.0s" x="600" y="80" text-anchor="middle" font-size="46" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Zrobione raz. Działa zawsze.</text><text class="sl" style="animation-delay:9.0s" x="600" y="80" text-anchor="middle" font-size="46" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Leniwy? Nie. Zautomatyzowany.</text><text class="sl" style="animation-delay:12.0s" x="600" y="80" text-anchor="middle" font-size="46" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Mniej klikania, więcej życia</text><text class="sl" style="animation-delay:15.0s" x="600" y="80" text-anchor="middle" font-size="40" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Komputer myśli, ja się uśmiecham</text><text class="sl" style="animation-delay:18.0s" x="600" y="80" text-anchor="middle" font-size="50" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Jak nie ma, to zrobię</text><text class="sl" style="animation-delay:21.0s" x="600" y="80" text-anchor="middle" font-size="34" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Trochę śrubek, trochę kabli, dużo radości</text><text class="sl" style="animation-delay:24.0s" x="600" y="80" text-anchor="middle" font-size="46" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Domowy wynalazca do usług</text><text class="sl" style="animation-delay:27.0s" x="600" y="80" text-anchor="middle" font-size="50" font-weight="800" fill="url(#tg)" font-family="Segoe UI,Helvetica,Arial,sans-serif">Mój sprzęt mnie lubi</text><rect x="540" y="96" width="120" height="3" rx="1.5" fill="#9fb2a5"/><rect class="bar" x="540" y="96" width="120" height="3" rx="1.5" fill="url(#tg)"/><defs><filter id="lb" x="-10%" y="-40%" width="120%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2f3e3a" flood-opacity=".18"/></filter></defs><rect x="340" y="113" width="520" height="30" rx="15" fill="#ffffff" fill-opacity=".9" filter="url(#lb)"/><circle cx="358" cy="128" r="4" fill="#3f6b62"/><circle cx="842" cy="128" r="4" fill="#c0574e"/><text class="st s0" style="animation-delay:1.5s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">OD POMYSŁU DO REALIZACJI</text><text class="st" style="animation-delay:4.7s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">NAJPIERW KAWA, POTEM MAGIA</text><text class="st" style="animation-delay:7.9s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">WYMYŚLONE NOCĄ, GOTOWE RANO</text><text class="st" style="animation-delay:11.1s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">PROBLEM? JEST NA TO SKRYPT.</text><text class="st" style="animation-delay:14.3s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">U MNIE ŚMIGA, U CIEBIE TEŻ BĘDZIE</text><text class="st" style="animation-delay:17.5s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">BŁĄD? TO TYLKO NOWA FUNKCJA</text><text class="st" style="animation-delay:20.7s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">ŚWIĘTY SPOKÓJ W PAKIECIE</text><text class="st" style="animation-delay:23.9s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">NARZĘDZIA, KTÓRE OSZCZĘDZAJĄ CZAS</text><text class="st" style="animation-delay:27.1s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">ZERO STRESU, SAMA FRAJDA</text><text class="st" style="animation-delay:30.3s" x="600" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6b62" letter-spacing="2.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">TWORZĘ · TESTUJĘ · ULEPSZAM</text>
